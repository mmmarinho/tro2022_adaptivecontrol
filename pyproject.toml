[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "ninja",
    "cmake>=3.12",
    "setuptools-git-versioning>=2.0,<3"
]
build-backend = "setuptools.build_meta"

[project]
name = 'marinholab-papers-tro2022-adaptivecontrol'
authors = [
    {name = "Murilo M. Marinho", email = "murilomarinho@ieee.org"}
]
maintainers = [
    {name = "Murilo M. Marinho", email = "murilomarinho@ieee.org"}
]
dynamic = ["version"]
dependencies=[
    'dqrobotics>=23.4.0a49'
]
description="A Python implementation of an example of 'Adaptive Constrained Kinematic Control using Partial or Complete Task-Space Measurements'"
readme = "README.md"
requires-python = ">= 3.9"

# The core package (adaptive control + headless M3_SimulatorDummy) only needs
# dqrobotics. The optional visualization backend (M3_PyPlotSimulator, which
# loads a YAML scene and draws it with dqrobotics-pyplot) is provided as the
# "viz" extra and imports its dependencies lazily, so the base package can be
# installed and used headless without them (python3 -m pip install .[viz]).
[project.optional-dependencies]
viz = [
    'dqrobotics-pyplot',
    'PyYAML',
]

# https://pypi.org/project/setuptools-git-versioning/
[tool.setuptools-git-versioning]
enabled = true
# https://stackoverflow.com/questions/73605607/how-to-use-setuptools-scm
dev_template = "{tag}.{ccount}"
dirty_template = "{tag}.{ccount}"
